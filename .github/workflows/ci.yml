name: CI Pipeline (Docker Build Check)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build ./backend --file ./backend/Dockerfile --tag backend:test

      - name: Build Frontend Docker Image
        run: |
          docker build ./frontend --file ./frontend/Dockerfile --tag frontend:test

      - name: Create Dummy .env for CI
        run: |
          touch .env
          echo "PORT=5000" >> .env
          echo "DATABASE_URL=postgresql://user:pass@localhost:5432/testdb" >> .env

      - name: Verify Docker Compose Configuration
        run: |
          docker compose config